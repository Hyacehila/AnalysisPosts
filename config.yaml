data:
  input_path: data/posts.json
  output_path: data/enhanced_posts.json
  resume_if_exists: true
  topics_path: data/topics.json
  sentiment_attributes_path: data/sentiment_attributes.json
  publisher_objects_path: data/publisher_objects.json
  belief_system_path: data/believe_system_common.json
  publisher_decision_path: data/publisher_decision.json
pipeline:
  start_stage: 1
  user_analysis_instruction: 重点分析公众的质疑焦点
stage1:
  mode: async
  checkpoint:
    enabled: true
    save_every: 100
    min_interval_seconds: 20.0
  nlp:
    enabled: true
    keyword_top_n: 8
    similarity_threshold: 0.85
    min_cluster_size: 2
stage2:
  mode: agent
  tool_source: mcp
  agent_max_iterations: 30
  search_reflection_max_rounds: 2
  forum_max_rounds: 2
  forum_min_rounds_for_sufficient: 2
  search_provider: tavily
  search_max_results: 3
  search_timeout_seconds: 60
  search_api_key: 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
  chart_tool_policy: coverage_first
  chart_missing_policy: warn
  chart_min_per_category:
    sentiment: 1
    topic: 1
    geographic: 1
    interaction: 1
    nlp: 1
stage3:
  max_iterations: 5
  chapter_review_max_rounds: 2
runtime:
  concurrent_num: 60
  max_retries: 3
  wait_time: 8
llm:
  acceptance_profile: fast
  reasoning_enabled_stage2: false
  reasoning_enabled_stage3: false
  vision_thinking_enabled: false
  request_timeout_seconds: 120
  glm_api_key: fecda0f3e009473a88c9bcfe711c3248.D35PCYssGvjLqObH
